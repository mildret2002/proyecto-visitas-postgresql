services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: visitas
      POSTGRES_USER: visitas_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./esquema_visitas.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U visitas_admin -d visitas]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
